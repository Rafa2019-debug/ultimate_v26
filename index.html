<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ByDataKu FINAL</title>
<style>
body{font-family:Arial;background:#f3f3f3;padding:12px}
textarea{width:100%;height:240px;padding:10px;border-radius:10px;font-size:12px}
button{padding:10px 14px;border:none;border-radius:10px;color:#fff;margin:5px;cursor:pointer}
.biru{background:#1565d8}
.hijau{background:#198754}
.orange{background:#f57c00}
.merah{background:#dc3545}
.card{background:#fff;padding:14px;border-radius:12px;margin-top:14px}
.hasil{white-space:pre-wrap;font-size:12px;line-height:1.7;outline:none}
</style>
</head>
<body>

<h2>ByDataKu FINAL</h2>

<textarea id="input" placeholder="Paste data TAB / WhatsApp"></textarea><br>

<button class="biru" onclick="susun()">Susun Semua</button>
<button class="hijau" onclick="copyAll()">Salin Semua</button>
<button class="orange" onclick="downloadTXT()">Download TXT</button>
<button class="merah" onclick="hapusSemua()">Hapus Riwayat</button>

<div id="total">Total data: 0</div>

<div id="hasil"></div>

<script>

let allText = "";

function minusBulan(tgl){

if(!tgl || !tgl.includes("-")) return tgl;

let p = tgl.split("-");

let d = p[0];
let m = parseInt(p[1]);
let y = parseInt(p[2]);

m--;

if(m < 1){
m = 12;
y--;
}

m = String(m).padStart(2,"0");

return d + "-" + m + "-" + y;

}

function formatSaldo(x){

x = String(x).replace(/\D/g,'');

return Number(x || 0).toLocaleString('id-ID');

}

function updateAll(){

let gabung = "";

document.querySelectorAll(".hasil").forEach(el=>{

gabung += el.innerText + "\n\n====================\n\n";

});

allText = gabung;

localStorage.setItem("bydataku_all", allText);
localStorage.setItem("bydataku_hasil", document.getElementById("hasil").innerHTML);

}

function susun(){

let raw = document.getElementById("input").value;

let hasil = document.getElementById("hasil");

hasil.innerHTML = "";

allText = "";

let blocks = raw.split(/\n(?=\[|\d)/);

let total = 0;

blocks.forEach((row,index)=>{

row = row.trim();

if(!row) return;

row = row.replace(/success/gi,'');

let nik = (row.match(/\b\d{16}\b/)||[])[0] || "";
if(!nik) return;

let noKpj = (row.match(/\b19\d{9}\b/)||[])[0] || "";

let ttl = "";

let semuaTanggal = row.match(/\d{2}-\d{2}-\d{4}/g);

if(semuaTanggal && semuaTanggal.length){
ttl = semuaTanggal[0];
}

let tanggalInput = "";

if(semuaTanggal && semuaTanggal.length > 1){
tanggalInput = semuaTanggal[semuaTanggal.length-1];
}

let jk = row.includes(" P ") ? "WANITA" : "PRIA";

let jumlah = "1";

let jumlahMatch = row.match(/\s([1-9])\s/);

if(jumlahMatch){
jumlah = jumlahMatch[1];
}

let saldo = "0";

let saldoList = row.match(/\b\d{6,8}\b/g);

if(saldoList && saldoList.length){
saldo = saldoList[saldoList.length-1];
}

let perusahaan = "";

let perusahaanMatch = row.match(/[A-Z& ]{5,}(?=\s\d{2}-\d{2}-\d{4})/);

if(perusahaanMatch){
perusahaan = perusahaanMatch[0].trim();
}

let nama = "";

let afterNik = row.split(nik)[1] || "";

let namaMatch = afterNik.match(/[A-Z ]{5,}/);

if(namaMatch){
nama = namaMatch[0].trim();
}

let sensor = "TUNGGAL";
let nominal = formatSaldo(saldo);

if(jumlah !== "1"){
sensor = "SENSOR JMO OK";
nominal = "GLOBAL " + nominal;
}

let text = `${nik}
${jk}
${ttl}

${sensor}
${nominal}
${perusahaan}
N/A ${minusBulan(tanggalInput)}

Qwer123@
${noKpj}
${nama}`;

allText += text + "\n\n====================\n\n";

total++;

let card = document.createElement("div");

card.className = "card";
card.id = "card_" + index;

card.innerHTML = `
<button class="hijau" onclick="copyText(${index})">📋 Salin</button>
<button class="biru" onclick="simpanKoreksi()">💾 Simpan</button>
<button class="merah" onclick="hapusData(${index})">🗑️ Hapus</button>

<div class="hasil" id="h${index}" contenteditable="true">${text}</div>
`;

hasil.appendChild(card);

});

document.getElementById("total").innerText = "Total data: " + total;

localStorage.setItem("bydataku_input",raw);
localStorage.setItem("bydataku_total",total);

updateAll();

aktifkanAutoSave();

}

function aktifkanAutoSave(){

document.querySelectorAll(".hasil").forEach(el=>{

el.addEventListener("input", function(){

updateAll();

});

});

}

window.onload = function(){

let i = localStorage.getItem("bydataku_input");
let h = localStorage.getItem("bydataku_hasil");
let t = localStorage.getItem("bydataku_total");
let a = localStorage.getItem("bydataku_all");

if(i) document.getElementById("input").value = i;
if(h) document.getElementById("hasil").innerHTML = h;
if(t) document.getElementById("total").innerText = "Total data: " + t;
if(a) allText = a;

aktifkanAutoSave();

}

function fallback(text){

let ta = document.createElement("textarea");

ta.value = text;

document.body.appendChild(ta);

ta.select();

document.execCommand("copy");

document.body.removeChild(ta);

}

function copyText(i){

let el = document.getElementById("h"+i);

if(!el) return;

let text = el.innerText;

if(navigator.clipboard){

navigator.clipboard.writeText(text).catch(()=>fallback(text));

}else{

fallback(text);

}

}

function copyAll(){

updateAll();

if(navigator.clipboard){

navigator.clipboard.writeText(allText);

}else{

fallback(allText);

}

}

function simpanKoreksi(){

updateAll();

alert("Koreksi berhasil disimpan");

}

function hapusData(i){

let el = document.getElementById("card_" + i);

if(el){
el.remove();
}

updateAll();

}

function hapusSemua(){

localStorage.clear();

document.getElementById("input").value = "";
document.getElementById("hasil").innerHTML = "";
document.getElementById("total").innerText = "Total data: 0";

allText = "";

}

function downloadTXT(){

updateAll();

let blob = new Blob([allText],{type:'text/plain'});

let a = document.createElement("a");

a.href = URL.createObjectURL(blob);

a.download = "hasil_bydataku.txt";

a.click();

}

</script>

</body>
</html>
