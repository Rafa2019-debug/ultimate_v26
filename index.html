<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ByDataKu Full FIX BPJS</title>
<style>
body{font-family:Arial;background:#eef2f7;padding:10px}
.container{max-width:700px;margin:auto}
textarea{
width:100%;padding:10px;border:2px solid #1565d8;
border-radius:12px;box-sizing:border-box;
font-family:monospace;resize:none;overflow:hidden;font-size:12px
}
#inputData{min-height:180px}
.card{
background:#fff;padding:12px;border-radius:14px;
margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.edit-area{border:none;outline:none;background:transparent;line-height:1.6}
button{
padding:9px 12px;border:none;border-radius:10px;
margin:4px;color:#fff;font-weight:bold;cursor:pointer;font-size:12px
}
.blue{background:#1565d8}.green{background:#198754}
.red{background:#dc3545}.orange{background:#ff6600}.gray{background:#6b7280}
.tools{display:flex;justify-content:space-between;margin-bottom:8px}
.left{display:flex;gap:6px}
</style>
</head>
<body>

<div class="container">

<h2>❤️ ByDataKu Full FIX BPJS</h2>

<button class="blue" onclick="setMode('tab')">🔵 Mode TAB</button>
<button class="green" onclick="setMode('bpjs')">🟢 Mode BPJS</button>

<div id="modeInfo"><b>Mode aktif: TAB</b></div><br>

<textarea id="inputData" placeholder="Paste data di sini"></textarea>

<button class="blue" onclick="proses()">Susun Semua</button>
<button class="green" onclick="copyAll()">Salin Semua</button>
<button class="orange" onclick="downloadTXT()">Download TXT</button>
<button class="gray" onclick="restoreCard()">↩ Restore</button>
<button class="red" onclick="hapusRiwayat()">Hapus Riwayat</button>

<h3 id="info"></h3>

<div id="hasil"></div>

</div>

<script>

let mode='tab';
let deletedData=null;

function setMode(m){
 mode=m;
 localStorage.setItem('mode',m);
 document.getElementById('modeInfo').innerHTML='<b>Mode aktif: '+m.toUpperCase()+'</b>';
}

function autoHeight(el){
 el.style.height='auto';
 el.style.height=el.scrollHeight+'px';
}

function minus1(t){
 if(!t || !t.includes('-')) return t;
 let p=t.split('-');
 let d=p[0],m=parseInt(p[1]),y=parseInt(p[2]);
 m--;
 if(m<1){m=12;y--;}
 return d+'-'+String(m).padStart(2,'0')+'-'+y;
}

function saveCards(arr){
 localStorage.setItem('cards',JSON.stringify(arr));
}

function getCards(){
 return JSON.parse(localStorage.getItem('cards')||'[]');
}

window.onload=()=>{

 mode=localStorage.getItem('mode')||'tab';

 document.getElementById('modeInfo').innerHTML='<b>Mode aktif: '+mode.toUpperCase()+'</b>';

 document.getElementById('inputData').value=localStorage.getItem('input')||'';

 render();

 autoHeight(document.getElementById('inputData'));

};

function render(){

 let hasil=document.getElementById('hasil');

 hasil.innerHTML='';

 let cards=getCards();

 cards.forEach((text,i)=>{

   hasil.innerHTML += `
   <div class="card">

      <div class="tools">

         <div class="left">
            <button class="green" onclick="copyOne(${i})">📋 Salin</button>
            <button class="blue" onclick="saveEdit()">💾 Simpan</button>
         </div>

         <button class="red" onclick="hapus(${i})">🗑 Hapus</button>

      </div>

      <textarea id="o${i}" class="edit-area">${text}</textarea>

   </div>`;

 });

 document.querySelectorAll('.edit-area').forEach(x=>{
    autoHeight(x);
    x.oninput=()=>{
      autoHeight(x);
      saveEdit();
    };
 });

}

function proses(){

 let input=document.getElementById('inputData').value.trim();

 if(!input){
   alert('Masukkan data');
   return;
 }

 localStorage.setItem('input',input);

 let hasil=[];

 // MODE TAB
 if(mode==='tab'){

   let lines=input.split(/\n+/);

   lines.forEach(line=>{

      if(!line.toLowerCase().includes('success')) return;

      let d=line.replace(/success/gi,'').trim().split(/\s+/);

      let nik=d.find(x=>/^\d{16}$/.test(x))||'';
      let kpj=d.find(x=>/^\d{11}$/.test(x))||'';

      if(!nik) return;

      let dates=d.filter(x=>/^\d{2}-\d{2}-\d{4}$/.test(x));

      let ttl=dates[0]||'';
      let akhir=dates[dates.length-1]||'';

      let gender=d.includes('P')?'WANITA':'PRIA';

      let nominal=d.find(x=>/^\d{7,9}$/.test(x))||'0';

      let nama='';

      let nikIndex=d.indexOf(nik);

      for(let i=nikIndex+1;i<d.length;i++){

         if(/^\d{2}-\d{2}-\d{4}$/.test(d[i])) break;

         nama += d[i]+' ';
      }

      nama=nama.trim();

      hasil.push(`${nik}
${gender}
${ttl}

TUNGGAL
${Number(nominal).toLocaleString('id-ID')}
PERUSAHAAN
N/A ${minus1(akhir)}

Qwer123@
${kpj}
${nama||'NAMA'}`);

   });

 }

 // MODE BPJS FIX
 else if(mode==='bpjs'){

   let blocks=input.split(/Provinsi:/i).filter(x=>x.trim()!='');

   blocks.forEach(b=>{

      let kab=(b.match(/Kabupaten:\s*KAB\.\s*([^\n]+)/i)||[])[1]||'';
      let kec=(b.match(/Kecamatan:\s*([^\n]+)/i)||[])[1]||'';

      let nik=(b.match(/\b\d{16}\b/)||[])[0]||'';

      if(!nik) return;

      let nama=(b.match(/\n([A-Z .]+)\n(?:PEREMPUAN|LAKI-LAKI)/i)||[])[1]||'';

      let gender=b.includes('PEREMPUAN')?'WANITA':'PRIA';

      let dates=b.match(/\d{2}-\d{2}-\d{4}/g)||[];

      let ttl=dates[0]||'';
      let akhir=dates[dates.length-1]||'';

      let jumlah=(b.match(/JUMLAH KPJ:\s*(\d+)/i)||[])[1]||'1';

      let kpj=(b.match(/\b\d{11}\b/)||[])[0]||'';

      let saldo=(b.match(/Rp([0-9.]+)/i)||[])[1]||'0';

      let perusahaan='';

      let lines=b.split('\n').map(x=>x.trim()).filter(x=>x!='');

      for(let i=0;i<lines.length;i++){

         if(/^\d{11}$/.test(lines[i])){

            perusahaan=lines[i+1]||'';

         }

      }

      let status='TUNGGAL';
      let nominal=saldo;

      if(jumlah!='1'){
         status='SENSOR JMO OK';
         nominal='GLOBAL '+saldo;
      }

      hasil.push(`*${kab.replace('KAB.','').trim()}, ${kec}*

${nik}
${gender}
${ttl}

${status}
${nominal}
${perusahaan}
N/A ${minus1(akhir)}

Qwer123@
${kpj}
${nama}`);

   });

 }

 saveCards(hasil);

 document.getElementById('info').innerHTML='Total data: '+hasil.length;

 render();

}

function saveEdit(){

 let arr=[];

 document.querySelectorAll('.edit-area').forEach(x=>arr.push(x.value));

 saveCards(arr);

}

function copyOne(i){

 navigator.clipboard.writeText(document.getElementById('o'+i).value);

 alert('Berhasil disalin');

}

function copyAll(){

 let t='';

 document.querySelectorAll('.edit-area').forEach(x=>{

   t += x.value + '\n\n====================\n\n';

 });

 navigator.clipboard.writeText(t);

 alert('Berhasil disalin');

}

function hapus(i){

 let data=getCards();

 deletedData={text:data[i],index:i};

 data.splice(i,1);

 saveCards(data);

 render();

}

function restoreCard(){

 if(!deletedData){
   alert('Tidak ada restore');
   return;
 }

 let data=getCards();

 data.splice(deletedData.index,0,deletedData.text);

 saveCards(data);

 render();

}

function downloadTXT(){

 let t='';

 document.querySelectorAll('.edit-area').forEach(x=>{

   t += x.value + '\n\n====================\n\n';

 });

 let blob=new Blob([t],{type:'text/plain'});

 let a=document.createElement('a');

 a.href=URL.createObjectURL(blob);

 a.download='hasil_bydataku.txt';

 a.click();

}

function hapusRiwayat(){

 localStorage.clear();

 location.reload();

}

window.addEventListener('beforeunload',saveEdit);

</script>

</body>
</html>
