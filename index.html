<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ByDataKu Full Normal</title>
<style>
body{font-family:Arial;background:#eef2f7;padding:12px}
.container{max-width:1000px;margin:auto}
textarea{
width:100%;
height:220px;
padding:12px;
border-radius:14px;
border:2px solid #1565d8;
font-size:12px;
box-sizing:border-box;
font-family:monospace
}
button{
padding:10px 14px;
margin:5px 5px 0 0;
border:none;
border-radius:10px;
font-size:12px;
color:#fff;
cursor:pointer;
font-weight:bold
}
.tab{background:#1565d8}
.bpjs{background:#16a34a}
.proses{background:#0b57d0}
.copyall{background:#198754}
.download{background:#ff6600}
.clear{background:#dc3545}
.restore{background:#6b7280}
.copy{background:#198754}
.save{background:#1565d8}
.delete{background:#dc3545}

.card{
background:#fff;
border-radius:16px;
padding:14px;
margin-top:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.tools{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px
}

.lefttools{
display:flex;
gap:6px
}

.edit-area{
width:100%;
border:none;
outline:none;
resize:none;
overflow:hidden;
font-size:12px;
line-height:1.6;
background:transparent;
font-family:monospace;
white-space:pre-wrap
}

#info{
margin-top:12px;
font-size:13px;
font-weight:bold
}
</style>
</head>
<body>

<div class="container">

<h2>❤️ ByDataKu Full Normal</h2>

<button class="tab" onclick="setMode('tab')">🔵 Mode TAB</button>
<button class="bpjs" onclick="setMode('bpjs')">🟢 Mode BPJS</button>

<div id="modeInfo"><b>Mode aktif: TAB</b></div><br>

<textarea id="inputData" placeholder="Paste data di sini"></textarea><br>

<button class="proses" onclick="prosesSemua()">Susun Semua</button>
<button class="copyall" onclick="copySemua()">Salin Semua</button>
<button class="download" onclick="downloadTXT()">Download TXT</button>
<button class="restore" onclick="restoreCard()">↩ Restore</button>
<button class="clear" onclick="hapusRiwayat()">Hapus Riwayat</button>

<div id="info"></div>
<div id="hasil"></div>

</div>

<script>

let mode="tab";
let deletedData=null;

function setMode(m){
 mode=m;
 document.getElementById("modeInfo").innerHTML="<b>Mode aktif: "+m.toUpperCase()+"</b>";
 localStorage.setItem("modeData",mode);
}

function minusBulan(t){
 if(!t||!t.includes("-")) return t;

 let p=t.split("-");
 let d=p[0];
 let m=parseInt(p[1]);
 let y=parseInt(p[2]);

 m--;

 if(m<1){
   m=12;
   y--;
 }

 return d+"-"+String(m).padStart(2,"0")+"-"+y;
}

function formatNominal(x){
 return Number(String(x).replace(/\D/g,"")).toLocaleString("id-ID");
}

function getCards(){
 return JSON.parse(localStorage.getItem("cardsData")||"[]");
}

function saveCards(cards){
 localStorage.setItem("cardsData",JSON.stringify(cards));
}

window.onload=function(){

 mode=localStorage.getItem("modeData")||"tab";

 document.getElementById("modeInfo").innerHTML="<b>Mode aktif: "+mode.toUpperCase()+"</b>";

 document.getElementById("inputData").value=localStorage.getItem("inputData")||"";

 renderCards();

 document.getElementById("info").innerHTML=localStorage.getItem("infoText")||"";

}

function renderCards(){

 document.getElementById("hasil").innerHTML="";

 const cards=getCards();

 cards.forEach((text,index)=>{

   const card=document.createElement("div");

   card.className="card";

   card.innerHTML=`
   <div class="tools">

   <div class="lefttools">
      <button class="copy" onclick="copyText(${index})">📋 Salin</button>
      <button class="save" onclick="simpanKoreksi()">💾 Simpan</button>
   </div>

   <button class="delete" onclick="hapusCard(${index})">🗑 Hapus</button>

   </div>

   <textarea id="text-${index}" class="edit-area">${text}</textarea>
   `;

   document.getElementById("hasil").appendChild(card);

 });

 autoHeight();
}

function autoHeight(){

 document.querySelectorAll(".edit-area").forEach(el=>{
   el.style.height="auto";
   el.style.height=el.scrollHeight+"px";
 });

}

function prosesSemua(){

 const input=document.getElementById("inputData").value.trim();

 if(!input){
   alert("Masukkan data");
   return;
 }

 localStorage.setItem("inputData",input);

 let hasilCards=[];

 if(mode==="tab"){

   const lines=input.split(/\n+/).filter(x=>x.trim()!="");

   lines.forEach((line)=>{

     if(!line.includes("success")) return;

     line=line.replace(/success/gi,"").trim();

     const data=line.split(/\s+/).filter(x=>x!="");

     const nik=data.find(x=>/^\d{16}$/.test(x))||"";
     const kpj=data.find(x=>/^19\d{9}$/.test(x))||"";

     if(!nik) return;

     const dates=data.filter(x=>/^\d{2}-\d{2}-\d{4}$/.test(x));

     const ttl=dates[0]||"";
     const akhir=dates[dates.length-1]||"";

     const genderIndex=data.findIndex(x=>x==="L"||x==="P");

     const gender=data[genderIndex]==="L"?"PRIA":"WANITA";

     const jumlah=data[genderIndex+1]||"1";

     const nominalRaw=data.find(x=>/^\d{7,9}$/.test(x))||"0";

     let sensor="TUNGGAL";
     let nominal=formatNominal(nominalRaw);

     if(jumlah!=="1"){
       sensor="SENSOR JMO OK";
       nominal="GLOBAL "+formatNominal(nominalRaw);
     }

     let nama="";
     const nikIndex=data.indexOf(nik);

     for(let i=nikIndex+1;i<data.length;i++){

       if(/^\d{2}-\d{2}-\d{4}$/.test(data[i])) break;

       nama += data[i]+" ";
     }

     nama=nama.trim();

     let perusahaan="";

     const nominalIndex=data.indexOf(nominalRaw);

     for(let i=nominalIndex+1;i<data.length;i++){

       if(/^\d{2}-\d{2}-\d{4}$/.test(data[i])) break;

       perusahaan += data[i]+" ";
     }

     perusahaan=perusahaan.trim();

     const hasil=`${nik}
${gender}
${ttl}

${sensor}
${nominal}
${perusahaan}
N/A ${minusBulan(akhir)}

Qwer123@
${kpj}
${nama}`;

     hasilCards.push(hasil);

   });

 }else{

   const blocks=input.split(/Provinsi:/).filter(x=>x.trim()!="");

   blocks.forEach((b)=>{

     let kab=(b.match(/Kabupaten:\s*KAB\.\s*([^\n]+)/i)||[])[1]||"";
     let kec=(b.match(/Kecamatan:\s*([^\n]+)/i)||[])[1]||"";

     let nik=(b.match(/\b\d{16}\b/)||[])[0]||"";

     if(!nik) return;

     let nama=(b.match(/\n([A-Z ]+)\n(?:PEREMPUAN|LAKI-LAKI)/)||[])[1]||"";

     let gender=b.includes("PEREMPUAN")?"WANITA":"PRIA";

     let dates=b.match(/\d{2}-\d{2}-\d{4}/g)||[];

     let ttl=dates[0]||"";
     let akhir=dates[dates.length-1]||"";

     let jumlah=(b.match(/JUMLAH KPJ:\s*(\d+)/i)||[])[1]||"1";

     let kpj=(b.match(/\b19\d{9}\b/)||[])[0]||"";

     let saldo=(b.match(/Rp([0-9.]+)/i)||[])[1]||"0";

     let perusahaan="";

     let lines=b.split("\n").map(x=>x.trim()).filter(x=>x!="");

     for(let i=0;i<lines.length;i++){
       if(/^19\d{9}$/.test(lines[i])){
         perusahaan=lines[i+1]||"";
       }
     }

     let sensor="TUNGGAL";
     let nominal=saldo;

     if(jumlah!="1"){
       sensor="SENSOR JMO OK";
       nominal="GLOBAL "+saldo;
     }

     const hasil=`*${kab.replace("KAB.","").trim()}, ${kec}*

${nik}
${gender}
${ttl}

${sensor}
${nominal}
${perusahaan}
N/A ${minusBulan(akhir)}

Qwer123@
${kpj}
${nama}`;

     hasilCards.push(hasil);

   });

 }

 saveCards(hasilCards);

 document.getElementById("info").innerHTML="Total data: "+hasilCards.length;
 localStorage.setItem("infoText",document.getElementById("info").innerHTML);

 renderCards();

}

function simpanKoreksi(){

 let cards=[];

 document.querySelectorAll(".edit-area").forEach(x=>{
   cards.push(x.value);
 });

 saveCards(cards);
}

function copyText(index){

 const val=document.getElementById("text-"+index).value;

 navigator.clipboard.writeText(val).catch(()=>{});

 alert("Berhasil disalin");
}

function copySemua(){

 let gabung="";

 document.querySelectorAll(".edit-area").forEach(x=>{
   gabung += x.value + "\\n\\n====================\\n\\n";
 });

 navigator.clipboard.writeText(gabung).catch(()=>{});

 alert("Berhasil disalin");
}

function hapusCard(index){

 let cards=getCards();

 deletedData={
   data:cards[index],
   index:index
 };

 cards.splice(index,1);

 saveCards(cards);

 renderCards();

 document.getElementById("info").innerHTML="Total data: "+cards.length;
 localStorage.setItem("infoText",document.getElementById("info").innerHTML);
}

function restoreCard(){

 if(!deletedData){
   alert("Tidak ada restore");
   return;
 }

 let cards=getCards();

 cards.splice(deletedData.index,0,deletedData.data);

 saveCards(cards);

 deletedData=null;

 renderCards();

 document.getElementById("info").innerHTML="Total data: "+cards.length;
 localStorage.setItem("infoText",document.getElementById("info").innerHTML);
}

function downloadTXT(){

 let gabung="";

 document.querySelectorAll(".edit-area").forEach(x=>{
   gabung += x.value + "\\n\\n====================\\n\\n";
 });

 const blob=new Blob([gabung],{type:"text/plain"});

 const a=document.createElement("a");

 a.href=URL.createObjectURL(blob);

 a.download="hasil_bydataku.txt";

 a.click();
}

function hapusRiwayat(){

 localStorage.clear();

 document.getElementById("hasil").innerHTML="";
 document.getElementById("inputData").value="";
 document.getElementById("info").innerHTML="";

 alert("Riwayat dihapus");
}

// autosave tanpa notif
document.addEventListener("input",function(e){

 if(
   e.target.classList.contains("edit-area") ||
   e.target.id==="inputData"
 ){

   simpanKoreksi();

   autoHeight();
 }

});

window.addEventListener("beforeunload",function(){

 simpanKoreksi();

});

</script>

</body>
</html>
