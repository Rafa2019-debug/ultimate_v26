<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ByDataKu</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:12px}
textarea{width:100%;height:230px;padding:10px;font-size:12px;border-radius:10px}
button{padding:10px;border:none;border-radius:8px;margin:4px;color:#fff;cursor:pointer}
.b{background:#1565d8}.g{background:#198754}.o{background:#f57c00}.r{background:#dc3545}
.card{background:#fff;padding:12px;margin-top:12px;border-radius:10px}
.hasil{white-space:pre-wrap;font-size:12px;line-height:1.6;outline:none}
</style>
</head>
<body>

<h2>ByDataKu</h2>

<textarea id="input" placeholder="Paste data TAB / BPJS / WhatsApp"></textarea><br>

<button class="b" onclick="susun()">Susun Semua</button>
<button class="g" onclick="copyAll()">Salin Semua</button>
<button class="o" onclick="downloadTXT()">Download TXT</button>
<button class="r" onclick="hapusSemua()">Hapus Riwayat</button>

<div id="total">Total data: 0</div>
<div id="hasil"></div>

<script>

let allText="";

function minusBulan(t){
 if(!t||!t.includes("-")) return t;
 let p=t.split("-");
 let d=p[0],m=parseInt(p[1]),y=parseInt(p[2]);
 m--;
 if(m<1){m=12;y--;}
 return d+"-"+String(m).padStart(2,"0")+"-"+y;
}

function saveData(){
 localStorage.setItem("bdk_input",document.getElementById("input").value);
 localStorage.setItem("bdk_hasil",document.getElementById("hasil").innerHTML);
 localStorage.setItem("bdk_total",document.getElementById("total").innerText);
 localStorage.setItem("bdk_all",allText);
}

window.onload=function(){
 document.getElementById("input").value=localStorage.getItem("bdk_input")||"";
 document.getElementById("hasil").innerHTML=localStorage.getItem("bdk_hasil")||"";
 document.getElementById("total").innerText=localStorage.getItem("bdk_total")||"Total data: 0";
 allText=localStorage.getItem("bdk_all")||"";
 aktifkanAutoSave();
}

function fallbackCopy(text){
 const ta=document.createElement("textarea");
 ta.value=text;
 ta.style.position="fixed";
 ta.style.opacity="0";
 document.body.appendChild(ta);
 ta.focus();
 ta.select();
 document.execCommand("copy");
 document.body.removeChild(ta);
 alert("Berhasil disalin");
}

function copyReal(text){
 if(navigator.clipboard && window.isSecureContext){
   navigator.clipboard.writeText(text)
   .then(()=>alert("Berhasil disalin"))
   .catch(()=>fallbackCopy(text));
 }else{
   fallbackCopy(text);
 }
}

function aktifkanAutoSave(){
 document.querySelectorAll(".hasil").forEach(el=>{
   el.addEventListener("input",()=>{
      updateAll();
   });
 });
}

function updateAll(){
 allText="";
 document.querySelectorAll(".hasil").forEach(el=>{
   allText += el.innerText + "\n\n====================\n\n";
 });
 saveData();
}

function buatCard(text,index){
 const hasil=document.getElementById("hasil");

 const card=document.createElement("div");
 card.className="card";
 card.id="c"+index;

 card.innerHTML=`
 <button class="g" onclick="copyText(${index})">📋 Salin</button>
 <button class="b" onclick="simpan()">💾 Simpan</button>
 <button class="r" onclick="hapus(${index})">🗑️ Hapus</button>

 <div class="hasil" id="h${index}" contenteditable="true">${text}</div>
 `;

 hasil.appendChild(card);
}

function susun(){

 const raw=document.getElementById("input").value.trim();

 document.getElementById("hasil").innerHTML="";
 allText="";

 let total=0;

 // BPJS multiline
 if(raw.includes("Provinsi:")){

   const blocks=raw.split(/\[\d+\/\d+.*?\]\s*teariky46:/g)
   .filter(x=>x.trim()!="");

   blocks.forEach((b,index)=>{

     let kab=(b.match(/Kabupaten:\s*KAB\.\s*([^\n]+)/i)||[])[1]||"";
     let kec=(b.match(/Kecamatan:\s*([^\n]+)/i)||[])[1]||"";

     let nik=(b.match(/\b\d{16}\b/)||[])[0]||"";
     if(!nik) return;

     let nama=(b.match(/\n([A-Z ]+)\n(?:PEREMPUAN|LAKI-LAKI)/)||[])[1]||"";

     let gender=b.includes("PEREMPUAN")?"WANITA":"PRIA";

     let ttl=(b.match(/\d{2}-\d{2}-\d{4}/)||[])[0]||"";

     let jumlah=(b.match(/JUMLAH KPJ:\s*(\d+)/i)||[])[1]||"1";

     let kpj=(b.match(/\b19\d{9}\b/)||[])[0]||"";

     let perusahaan="";
     let lines=b.split("\n").map(x=>x.trim()).filter(x=>x!="");

     for(let i=0;i<lines.length;i++){
       if(/^19\d{9}$/.test(lines[i])){
         perusahaan=lines[i+1]||"";
       }
     }

     let tglList=b.match(/\d{2}-\d{2}-\d{4}/g)||[];
     let tanggal=tglList[tglList.length-1]||"";

     let saldo=(b.match(/Rp([0-9.]+)/i)||[])[1]||"0";

     let sensor="TUNGGAL";
     let nominal=saldo;

     if(jumlah!="1"){
       sensor="SENSOR JMO OK";
       nominal="GLOBAL "+saldo;
     }

     let text=`*${kab.replace("KAB.","").trim()}, ${kec}

${nik}
${gender}
${ttl}

${sensor}
${nominal}
${perusahaan}
N/A ${minusBulan(tanggal)}

Qwer123@
${kpj}
${nama}`;

     allText += text + "\n\n====================\n\n";

     buatCard(text,index);

     total++;

   });

 } else {

   // TAB format
   const rows=raw.split("\n").filter(x=>x.trim()!="");

   rows.forEach((row,index)=>{

     if(!row.includes("\t")) return;

     const col=row.split("\t");

     if(col.length<13) return;

     let kpj=col[1]||"";
     let nik=col[2]||"";
     let nama=col[3]||"";
     let ttl=col[4]||"";
     let gender=col[7]=="P"?"WANITA":"PRIA";
     let jumlah=col[8]||"1";
     let saldo=Number(col[9]||0).toLocaleString('id-ID');
     let perusahaan=col[10]||"";
     let tanggal=minusBulan(col[12]||"");

     let sensor="TUNGGAL";
     let nominal=saldo;

     if(jumlah!="1"){
       sensor="SENSOR JMO OK";
       nominal="GLOBAL "+saldo;
     }

     let text=`${nik}
${gender}
${ttl}

${sensor}
${nominal}
${perusahaan}
N/A ${tanggal}

Qwer123@
${kpj}
${nama}`;

     allText += text + "\n\n====================\n\n";

     buatCard(text,index);

     total++;

   });

 }

 document.getElementById("total").innerText="Total data: "+total;

 saveData();

 aktifkanAutoSave();

}

function simpan(){
 updateAll();
 alert("Koreksi tersimpan");
}

function hapus(i){
 const el=document.getElementById("c"+i);
 if(el) el.remove();
 updateAll();
}

function copyText(i){
 const el=document.getElementById("h"+i);
 if(el) copyReal(el.innerText);
}

function copyAll(){
 updateAll();
 copyReal(allText);
}

function hapusSemua(){
 localStorage.clear();
 document.getElementById("input").value="";
 document.getElementById("hasil").innerHTML="";
 document.getElementById("total").innerText="Total data: 0";
 allText="";
}

function downloadTXT(){
 updateAll();
 const blob=new Blob([allText],{type:'text/plain'});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="hasil_bydataku.txt";
 a.click();
}

</script>

</body>
</html>
