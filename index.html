<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Perapian Data (Pro)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 20px;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .input-section {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
        textarea.main-input {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            font-size: 14px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            transition: background 0.3s;
        }
        .btn-process { background-color: #007bff; }
        .btn-process:hover { background-color: #0056b3; }
        .btn-clear { background-color: #dc3545; }
        .btn-clear:hover { background-color: #c82333; }
        
        .output-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        
        /* Gaya standar kartu */
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }
        
        /* Gaya jika kartu ditandai Selesai */
        .card.done {
            background-color: #e2fced; /* Warna hijau lembut */
            border: 2px solid #28a745;
            opacity: 0.85; /* Sedikit transparan agar tidak mencolok */
        }

        .number-badge {
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f2f5;
        }
        .card.done .number-badge {
            color: #28a745; /* Ubah warna teks urutan jadi hijau jika selesai */
            border-bottom-color: #c3e6cb;
        }

        .card textarea {
            width: 100%;
            height: 280px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
            resize: vertical;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .card.done textarea {
            background-color: #f8fff9; /* Warna dalam teks ikut sedikit hijau */
        }
        .card textarea:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }

        /* Grup tombol di dalam kartu */
        .card-actions {
            display: flex;
            gap: 10px;
        }
        .btn-copy, .btn-done {
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            transition: background 0.3s;
            font-size: 14px;
        }
        .btn-copy { background-color: #28a745; }
        .btn-copy:hover { background-color: #218838; }
        
        .btn-done { background-color: #6c757d; } /* Warna abu-abu standar */
        .btn-done:hover { background-color: #5a6268; }
        
        /* Ubah warna tombol Selesai jika aktif */
        .btn-done.active { background-color: #ffc107; color: #333; }
        .btn-done.active:hover { background-color: #e0a800; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Aplikasi Perapian Data</h2>
        <p style="margin:0; color:#666; font-size:14px;">(Dilengkapi Penanda "Selesai" dan Auto-Sort)</p>
    </div>

    <div class="container">
        <div class="input-section">
            <label for="inputText">Tempelkan Data Mentah:</label>
            <textarea id="inputText" class="main-input" placeholder="[2/6, 03.24] Putri: *OGAN ILIR..."></textarea>
            
            <div class="button-group">
                <button class="btn btn-process" onclick="prosesData()">Rapihkan Data</button>
                <button class="btn btn-clear" onclick="bersihkanData()">Bersihkan Semua</button>
            </div>
        </div>

        <div class="output-section" id="outputArea">
            </div>
    </div>

    <script>
        // Memuat data saat halaman dibuka
        window.onload = function() {
            const savedRawInput = localStorage.getItem('rawInput');
            if (savedRawInput) {
                document.getElementById('inputText').value = savedRawInput;
            }
            tampilkanOutput(); 
        };

        // Menyimpan input mentah otomatis
        document.getElementById('inputText').addEventListener('input', function() {
            localStorage.setItem('rawInput', this.value);
        });

        // Proses merapihkan data baru
        function prosesData() {
            const rawText = document.getElementById('inputText').value;
            const blocks = rawText.split(/\[[^\]]+\]\s*[^:]+:\s*/).filter(b => b.trim() !== '');
            
            let arrayHasil = [];

            blocks.forEach((block, index) => {
                let lines = block.trim().split('\n');

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];
                    let dateMatch = line.match(/(\d{2}-\d{2}-\d{4}|\d{2}\/\d{2}\/\d{4})/);
                    
                    if (dateMatch) {
                        let fullDate = dateMatch[1];
                        let year = fullDate.slice(-4);
                        let place = line.replace(fullDate, '').replace(/,/g, '').trim();
                        
                        if (place === '') {
                            place = 'TEMPAT';
                        }
                        
                        lines[i] = `${place}, ${year}`;
                        break; 
                    }
                }

                const formattedText = lines.join('\n');
                
                // Menyimpan data sebagai objek untuk melacak status Selesai dan ID asli
                arrayHasil.push({
                    id: index + 1,
                    text: formattedText,
                    selesai: false
                });
            });

            localStorage.setItem('processedData', JSON.stringify(arrayHasil));
            tampilkanOutput();
        }

        // Menampilkan output
        function tampilkanOutput() {
            const outputArea = document.getElementById('outputArea');
            outputArea.innerHTML = ''; 

            const savedData = localStorage.getItem('processedData');
            if (!savedData) return;

            let arrayHasil = JSON.parse(savedData);

            // Adaptasi jika masih memakai format data versi lama (String biasa)
            if (arrayHasil.length > 0 && typeof arrayHasil[0] === 'string') {
                arrayHasil = arrayHasil.map((teks, index) => ({
                    id: index + 1,
                    text: teks,
                    selesai: false
                }));
            }

            // PENGURUTAN: Yang 'selesai: false' di atas, 'selesai: true' di bawah.
            // Jika sama-sama belum/sudah selesai, urutkan berdasarkan nomor aslinya.
            let arrayTampil = [...arrayHasil].sort((a, b) => {
                if (a.selesai === b.selesai) {
                    return a.id - b.id; 
                }
                return a.selesai ? 1 : -1;
            });

            arrayTampil.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';
                if (item.selesai) {
                    card.classList.add('done'); // Tambahkan warna hijau
                }

                const numberBadge = document.createElement('div');
                numberBadge.className = 'number-badge';
                // Teks status urutan (Kasih label "(Selesai)" jika sudah)
                numberBadge.innerText = item.selesai ? `Urutan ke-${item.id} (Selesai)` : `Urutan ke-${item.id}`;

                const textarea = document.createElement('textarea');
                textarea.value = item.text;
                
                // Menyimpan editan manual
                textarea.addEventListener('input', function() {
                    // Cari indeks asli di arrayHasil
                    const indexAsli = arrayHasil.findIndex(x => x.id === item.id);
                    if(indexAsli !== -1) {
                        arrayHasil[indexAsli].text = this.value;
                        localStorage.setItem('processedData', JSON.stringify(arrayHasil));
                    }
                });

                // Area Tombol
                const actionDiv = document.createElement('div');
                actionDiv.className = 'card-actions';

                // 1. Tombol Salin (Anti popup keyboard)
                const btnCopy = document.createElement('button');
                btnCopy.className = 'btn-copy';
                btnCopy.innerText = 'Salin Data';
                
                btnCopy.onclick = () => {
                    textarea.setAttribute('readonly', 'true');
                    textarea.select();
                    textarea.setSelectionRange(0, 99999);
                    
                    try {
                        document.execCommand('copy');
                        btnCopy.innerText = 'Tersalin!';
                        btnCopy.style.backgroundColor = '#1e7e34';
                        setTimeout(() => {
                            btnCopy.innerText = 'Salin Data';
                            btnCopy.style.backgroundColor = '#28a745';
                        }, 2000);
                    } catch (err) {
                        alert("Gagal menyalin!");
                    }

                    textarea.removeAttribute('readonly');
                    window.getSelection().removeAllRanges();
                };

                // 2. Tombol Selesai
                const btnDone = document.createElement('button');
                btnDone.className = 'btn-done';
                if (item.selesai) {
                    btnDone.classList.add('active');
                    btnDone.innerText = 'Batal Selesai';
                } else {
                    btnDone.innerText = 'Tandai Selesai';
                }

                btnDone.onclick = () => {
                    // Balikkan status Selesai
                    const indexAsli = arrayHasil.findIndex(x => x.id === item.id);
                    if(indexAsli !== -1) {
                        arrayHasil[indexAsli].selesai = !arrayHasil[indexAsli].selesai;
                        localStorage.setItem('processedData', JSON.stringify(arrayHasil));
                        // Render ulang agar urutannya langsung menyesuaikan (pindah ke bawah/atas)
                        tampilkanOutput();
                    }
                };

                actionDiv.appendChild(btnCopy);
                actionDiv.appendChild(btnDone);

                card.appendChild(numberBadge);
                card.appendChild(textarea);
                card.appendChild(actionDiv);
                
                outputArea.appendChild(card);
            });
        }

        function bersihkanData() {
            if (confirm("Apakah Anda yakin ingin menghapus semua data? Ini tidak bisa dibatalkan.")) {
                localStorage.removeItem('rawInput');
                localStorage.removeItem('processedData');
                document.getElementById('inputText').value = '';
                document.getElementById('outputArea').innerHTML = '';
            }
        }
    </script>
</body>
</html>
